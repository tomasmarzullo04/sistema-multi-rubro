# Postgres local para desarrollo (Fase 0, ítem 2 del roadmap).
#
# Uso:
#   pnpm db:up        # levanta Postgres
#   pnpm db:migrate   # aplica migraciones (requiere packages/db/.env, ver .env.example)
#   pnpm db:down      # lo baja (los datos persisten en el volumen)
services:
  postgres:
    image: postgres:16-alpine
    container_name: sistema-multi-rubro-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_multi_rubro}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sistema_multi_rubro}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
